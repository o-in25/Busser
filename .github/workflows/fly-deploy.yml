# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    name: Test and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm test

      # APP_VERSION is a build-time build-arg in prod; supply a placeholder so
      # svelte-kit sync generates its $env/static/private type for the check.
      - run: pnpm run check
        env:
          APP_VERSION: ci

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # linux runners need webkit's system libs (mobile-safari is webkit too)
      - run: pnpm exec playwright install --with-deps chromium webkit

      # build needs APP_VERSION for $env/static/private, same as the check step.
      # GLOBAL_WORKSPACE stops the root layout throwing; E2E_NO_DB skips db-backed pages (no db in ci yet)
      - run: pnpm test:e2e
        env:
          CI: 'true'
          APP_VERSION: ci
          GLOBAL_WORKSPACE: e2e
          E2E_NO_DB: 'true'

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy app
    # only deploy on a real push to main, never on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    concurrency: deploy-group
    environment:
      name: production
      url: https://busserapp.com
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for tags

      - name: Bump version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        # Secrets are managed via `fly secrets` and injected at runtime — the only
        # build arg is APP_VERSION, which is stamped into the bundle at build time.
        run: |
          flyctl deploy --remote-only --no-cache \
            --build-arg APP_VERSION=${{ steps.tag_version.outputs.new_tag }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: |
            ## Changes
            ${{ steps.tag_version.outputs.changelog }}

            ## Deployment
            - Deployed to: https://busserapp.com
            - Commit: ${{ github.sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
