<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>%sveltekit.status% — Busser</title>
    <link rel="icon" href="/favicon.png">
    <style>
      :root {
        --primary: #f84e80;
        --text: #f5f3f7;
        --muted: #9a94a8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        color: var(--text);
        font-family:
          'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(ellipse 85% 60% at 12% 2%, rgba(226, 30, 96, 0.2) 0%, transparent 62%),
          radial-gradient(ellipse 80% 60% at 90% 6%, rgba(122, 78, 190, 0.18) 0%, transparent 62%),
          radial-gradient(ellipse 100% 70% at 50% 104%, rgba(96, 66, 156, 0.12) 0%, transparent 66%),
          linear-gradient(160deg, #08070e 0%, #0a0911 60%, #08080e 100%);
        background-attachment: fixed;
      }
      .card {
        width: 100%;
        max-width: 30rem;
        padding: 2.5rem 2rem;
        text-align: center;
        border-radius: 1.25rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      .status {
        font-size: 5rem;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--primary);
      }
      .message {
        margin: 1.25rem auto 2rem;
        max-width: 24rem;
        color: var(--muted);
        line-height: 1.5;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        justify-content: center;
      }
      @media (min-width: 480px) {
        .actions {
          flex-direction: row;
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.65rem 1.25rem;
        border-radius: 0.75rem;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.09);
      }
      .btn-primary {
        border-color: transparent;
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: #e13a6e;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="status">%sveltekit.status%</div>
      <p class="message">%sveltekit.error.message%</p>
      <div class="actions">
        <button class="btn btn-primary" onclick="location.reload()">Try Again</button>
        <a class="btn" href="/">Go Home</a>
      </div>
    </div>
  </body>
</html>
