<!doctype html>
<html lang="en" class="dark">
	<head>
		<title>Busser</title>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="description" content="Manage your home bar — track inventory, discover cocktails, and collaborate with friends." />

		<!-- PWA -->
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />

		<!-- iOS standalone -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Busser" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png">

		<!-- Inter Font -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			/* light mode -- soft mesh the translucent cards let bleed through as gentle color.
			   fixed layer so cards read against shifting color as you scroll */
			body {
				background:
					radial-gradient(ellipse 75% 60% at 10% 4%, rgba(253, 111, 148, 0.34) 0%, transparent 60%),
					radial-gradient(ellipse 70% 60% at 92% 8%, rgba(165, 125, 213, 0.30) 0%, transparent 60%),
					radial-gradient(ellipse 85% 70% at 78% 96%, rgba(150, 190, 230, 0.20) 0%, transparent 64%),
					linear-gradient(160deg, #ece6f4 0%, #f4ecf0 52%, #e7eef6 100%);
				background-attachment: fixed;
			}
			/* dark mode -- calm pink->purple wash, kept subtle so it doesn't compete with content */
			.dark body {
				background:
					radial-gradient(ellipse 85% 60% at 12% 2%, rgba(226, 30, 96, 0.20) 0%, transparent 62%),
					radial-gradient(ellipse 80% 60% at 90% 6%, rgba(122, 78, 190, 0.18) 0%, transparent 62%),
					radial-gradient(ellipse 100% 70% at 50% 104%, rgba(96, 66, 156, 0.12) 0%, transparent 66%),
					linear-gradient(160deg, #08070e 0%, #0a0911 60%, #08080e 100%);
				background-attachment: fixed;
			}
			/* baseline — safe for all contexts */
			html, body {
				-webkit-tap-highlight-color: transparent;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				touch-action: manipulation;
			}
			/* single scroll container — standalone PWA only */
			@media (display-mode: standalone) {
				html {
					height: 100%;
					overflow: hidden;
				}
				body {
					height: 100%;
					overflow-y: auto;
					-webkit-overflow-scrolling: touch;
					/* kill ios rubber-band so it doesn't run alongside our custom pull-to-refresh
					   (the "double scroll"); native ptr in the browser tab is untouched */
					overscroll-behavior-y: contain;
				}
			}
			button, a, [role="button"] {
				-webkit-touch-callout: none;
				user-select: none;
			}
		</style>
		<!-- OG Meta Tags -->
		<meta property="og:title" content="Busser — Home Bar Management" />
		<meta property="og:description" content="From shelf to shaker. Manage your home bar inventory, discover cocktails, and collaborate with friends." />
		<meta property="og:image" content="/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://busserapp.com" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="/og-image.png" />
		%sveltekit.head%
		<script>
			if (localStorage.getItem('color-theme')) {
				// explicit preference - overrides default
				localStorage.getItem('color-theme') === 'dark'
					? window.document.documentElement.classList.add('dark')
					: window.document.documentElement.classList.remove('dark');
			} else {
				// no preference - keep dark as default (already set on html element)
				// only switch to light if user explicitly prefers it
				if (window.matchMedia('(prefers-color-scheme: light)').matches)
					window.document.documentElement.classList.remove('dark');
			}
		</script>
	</head>

	<body data-sveltekit-preload-data="hover" class="flex flex-col min-h-screen">
		<div style="display: contents" class="flex min-h-full flex-col">%sveltekit.body%</div>
	</body>
</html>
