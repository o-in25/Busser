<!doctype html>
<html lang="en" class="dark">
	<head>
		<title>Busser</title>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="Manage your home bar — track inventory, discover cocktails, and collaborate with friends."
		/>

		<!-- PWA -->
		<link rel="manifest" href="/manifest.json" />
		<!-- match the page mesh's base tone so ios blends the status bar/toolbar into the page -->
		<meta name="theme-color" content="#08070e" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ece6f4" media="(prefers-color-scheme: light)" />

		<!-- iOS standalone -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Busser" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png" />

		<!-- Inter is self-hosted via @fontsource-variable/inter (imported in +layout.svelte) -->
		<style>
			/* flat base on html — matches theme-color exactly so the ios status-bar tint, the page
			   edges, and the overscroll/rubber-band canvas all read as one continuous color (seamless,
			   paradox-style). the decorative mesh lives on body so it only paints the content area */
			html {
				background: #ece6f4;
			}
			html.dark {
				background: #08070e;
			}
			/* light mode -- soft mesh the translucent cards let bleed through as gentle color.
			   glows are pushed down into the content zone (origins ~mid-page) so the top ~15%
			   stays on the base tone and meets the status-bar theme-color seamlessly, while the
			   colour still blooms where it's safe — vibrant page, clean chrome */
			body {
				background:
					radial-gradient(ellipse 75% 44% at 6% 46%, rgba(253, 111, 148, 0.3) 0%, transparent 60%),
					radial-gradient(ellipse 68% 44% at 95% 42%, rgba(165, 125, 213, 0.26) 0%, transparent 60%),
					radial-gradient(ellipse 85% 70% at 78% 96%, rgba(150, 190, 230, 0.2) 0%, transparent 64%),
					linear-gradient(160deg, #ece6f4 0%, #f4ecf0 52%, #e7eef6 100%);
			}
			/* dark mode -- calm pink->purple wash, kept subtle so it doesn't compete with content */
			.dark body {
				background:
					radial-gradient(ellipse 85% 60% at 12% 2%, rgba(226, 30, 96, 0.2) 0%, transparent 62%),
					radial-gradient(ellipse 80% 60% at 90% 6%, rgba(122, 78, 190, 0.18) 0%, transparent 62%),
					radial-gradient(
						ellipse 100% 70% at 50% 104%,
						rgba(96, 66, 156, 0.12) 0%,
						transparent 66%
					),
					linear-gradient(160deg, #08070e 0%, #0a0911 60%, #08080e 100%);
			}
			/* native scrollbar + browser overscroll canvas follow the theme. without this the
			   scrollbar track renders light in dark mode (the white strip on the right) and the
			   rubber-band area falls back to white */
			html {
				color-scheme: light;
			}
			html.dark {
				color-scheme: dark;
			}
			/* baseline — safe for all contexts */
			html,
			body {
				-webkit-tap-highlight-color: transparent;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				touch-action: manipulation;
			}
			/* single scroll container — standalone PWA only */
			@media (display-mode: standalone) {
				html {
					height: 100%;
					overflow: hidden;
				}
				body {
					height: 100%;
					overflow-y: auto;
					-webkit-overflow-scrolling: touch;
					/* kill ios rubber-band so it doesn't run alongside our custom pull-to-refresh
					   (the "double scroll"); native ptr in the browser tab is untouched */
					overscroll-behavior-y: contain;
				}
			}
			button,
			a,
			[role='button'] {
				-webkit-touch-callout: none;
				user-select: none;
			}
		</style>
		<!-- OG Meta Tags — absolute image url so linkedin/slack/imessage scrapers resolve it -->
		<meta property="og:site_name" content="Busser" />
		<meta property="og:title" content="Busser — Home Bar Management" />
		<meta
			property="og:description"
			content="From shelf to shaker. Manage your home bar inventory, discover cocktails, and collaborate with friends."
		/>
		<meta property="og:image" content="https://busserapp.com/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Busser — from shelf to shaker" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://busserapp.com" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Busser — Home Bar Management" />
		<meta
			name="twitter:description"
			content="From shelf to shaker. Manage your home bar inventory, discover cocktails, and collaborate with friends."
		/>
		<meta name="twitter:image" content="https://busserapp.com/og-image.png" />
		%sveltekit.head%
		<script>
			if (localStorage.getItem('color-theme')) {
				// explicit preference - overrides default
				localStorage.getItem('color-theme') === 'dark'
					? window.document.documentElement.classList.add('dark')
					: window.document.documentElement.classList.remove('dark');
			} else {
				// no preference - keep dark as default (already set on html element)
				// only switch to light if user explicitly prefers it
				if (window.matchMedia('(prefers-color-scheme: light)').matches)
					window.document.documentElement.classList.remove('dark');
			}
		</script>
	</head>

	<body data-sveltekit-preload-data="hover" class="flex flex-col min-h-[100dvh]">
		<div style="display: contents" class="flex min-h-full flex-col">%sveltekit.body%</div>
	</body>
</html>
